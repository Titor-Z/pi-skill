name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip real publish)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Publish
        run: >-
          npm publish --access public
          ${{ inputs.dry_run == true && '--dry-run' || '--provenance' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
